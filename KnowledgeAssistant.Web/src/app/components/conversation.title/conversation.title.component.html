@if (isEditing) {
  <input
    #editInput
    class="title-input"
    [(ngModel)]="editValue"
    (click)="$event.stopPropagation()"
    (keydown.enter)="commitRename()"
    (keydown.escape)="cancelRename()"
    (blur)="commitRename()" />
} @else {
  <div class="title-block">
    <span class="title">{{ item.title || 'Untitled' }}</span>
    @if (item.topic) {
      <span class="topic-badge">{{ item.topic }}</span>
    }
  </div>
  <div class="menu-wrapper">
    <button (click)="toggleMenu($event)">⋮</button>
    @if (showMenu) {
      <ul class="menu" [style.top.px]="menuTop" [style.left.px]="menuLeft">
        <li (click)="onRename($event)">Rename</li>
        <li class="has-submenu" (click)="toggleTopicMenu($event)">
          Set Topic ▸
          @if (showTopicMenu) {
            <ul class="submenu" (click)="$event.stopPropagation()">
              <li [class.active]="!item.topicId" (click)="onSetTopic(null, $event)">No topic</li>
              @for (t of topics; track t.id) {
                <li [class.active]="t.id === item.topicId" (click)="onSetTopic(t.id, $event)">{{ t.name }}</li>
              }
            </ul>
          }
        </li>
        <li (click)="onDelete($event)">Delete</li>
      </ul>
    }
  </div>
}
