server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API calls to the backend container so the SPA can use a
    # relative baseUrl and work from any host on the network.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connections open for streaming (Server-Sent Events / chunked chat responses).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Angular client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
